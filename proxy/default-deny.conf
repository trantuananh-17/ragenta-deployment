# Catch-all for requests that name no host we serve — the bare IP address, an
# old hostname, a scanner probing by address. Without it, whichever vhost nginx
# loads first answers for everything, so the API would be reachable at
# http://<ip>/ and a stale DNS record could keep resolving there indefinitely.
#
# 444 closes the connection without a response: nothing to fingerprint.
# ssl_reject_handshake refuses TLS at the handshake, so this block needs no
# certificate of its own.
#
# Install it alongside the real vhosts:
#   sudo cp proxy/default-deny.conf /etc/nginx/sites-available/ragenta-default-deny
#   sudo ln -sfn /etc/nginx/sites-available/ragenta-default-deny /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;

    ssl_reject_handshake on;

    return 444;
}
