# Reverse proxy for the staging API — api.tranhtuananh-anhtt.site.
#
# environments/staging publishes the API on 127.0.0.1:8080 only, so this is the
# single way in from outside the VM.
#
# The certificate comes from certbot in *certonly* mode, never `--nginx`. The
# plugin edits the installed file in place, which would make the copy on the VM
# diverge from this one and would be silently undone the next time someone
# reinstalls it. Here the TLS lines live in the repository and certbot only
# writes into /etc/letsencrypt.
#
# Install:
#   sudo mkdir -p /var/www/certbot
#   sudo certbot certonly --webroot -w /var/www/certbot -d api.tranhtuananh-anhtt.site
#   sudo cp proxy/staging.conf /etc/nginx/sites-available/ragenta-staging
#   sudo ln -sfn /etc/nginx/sites-available/ragenta-staging /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# No IPv6 listeners: this VM has no global IPv6 address, and the domain has no
# AAAA record pointing here. Add both together or neither — an AAAA without a
# listener sends half the internet to a connection refused.

server {
    listen 80;
    server_name api.tranhtuananh-anhtt.site;

    # Renewal re-runs the HTTP-01 challenge, so this must stay reachable over
    # plain HTTP forever. It is matched before the redirect below.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.tranhtuananh-anhtt.site;

    ssl_certificate     /etc/letsencrypt/live/api.tranhtuananh-anhtt.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.tranhtuananh-anhtt.site/privkey.pem;

    # Written out rather than included from certbot's options-ssl-nginx.conf:
    # that file belongs to a package this config should not depend on.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Document ingestion posts files through here.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Chat responses stream token by token; nginx buffering would hold the
        # whole answer until the request finished.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
