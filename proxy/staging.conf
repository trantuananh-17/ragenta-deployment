# Reverse proxy for the staging API.
#
# environments/staging publishes the API on 127.0.0.1:8080 only, so this is the
# single way in from outside the VM. Install it on the staging host:
#
#   sudo cp proxy/staging.conf /etc/nginx/sites-available/ragenta-staging
#   sudo ln -sfn /etc/nginx/sites-available/ragenta-staging \
#                /etc/nginx/sites-enabled/ragenta-staging
#   sudo nginx -t && sudo systemctl reload nginx
#
# Plain HTTP against the VM's address, which is acceptable only while staging
# holds no real accounts. Before anyone signs in, give it a domain and a
# certificate — session cookies over HTTP are readable in transit.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Document ingestion will post files through here.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Chat responses stream token by token; nginx buffering would hold the
        # whole answer until the request finished.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
