# Reverse proxy for the staging API — staging-backend.ragenta.cloud.
#
# environments/staging publishes the API on 127.0.0.1:8080 only, so this is the
# single way in from outside the VM.
#
# The certificate comes from certbot in *certonly* mode, never `--nginx`. The
# plugin edits the installed file in place, which would make the copy on the VM
# diverge from this one and would be silently undone the next time someone
# reinstalls it. Here the TLS lines live in the repository and certbot only
# writes into /etc/letsencrypt.
#
# Install:
#   sudo mkdir -p /var/www/certbot
#   sudo certbot certonly --webroot -w /var/www/certbot -d staging-backend.ragenta.cloud
#   sudo cp proxy/staging.conf /etc/nginx/sites-available/ragenta-staging
#   sudo ln -sfn /etc/nginx/sites-available/ragenta-staging /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# No IPv6 listeners: this VM has no global IPv6 address, and the domain has no
# AAAA record pointing here. Add both together or neither — an AAAA without a
# listener sends half the internet to a connection refused.

server {
    listen 80;
    server_name staging-backend.ragenta.cloud;

    # Renewal re-runs the HTTP-01 challenge, so this must stay reachable over
    # plain HTTP forever. It is matched before the redirect below.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name staging-backend.ragenta.cloud;

    ssl_certificate     /etc/letsencrypt/live/staging-backend.ragenta.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging-backend.ragenta.cloud/privkey.pem;

    # Written out rather than included from certbot's options-ssl-nginx.conf:
    # that file belongs to a package this config should not depend on.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Document ingestion posts files through here.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Chat responses stream token by token; nginx buffering would hold the
        # whole answer until the request finished.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}

# ── Marketing site ───────────────────────────────────────────────────────────
#
# The landing container publishes 127.0.0.1:8081 only, so this is the single way
# in from outside the VM. Same certificate procedure as above. The marketing site
# is the root of its environment rather than a named host — staging. here, the
# apex ragenta.cloud in production — because nobody types a service name to
# reach a home page:
#
#   sudo certbot certonly --webroot -w /var/www/certbot -d staging.ragenta.cloud

server {
    listen 80;
    server_name staging.ragenta.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name staging.ragenta.cloud;

    ssl_certificate     /etc/letsencrypt/live/staging.ragenta.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.ragenta.cloud/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Staging serves the same pages production will. Without this they get
    # indexed under the staging hostname and compete with the real site later.
    # Crawling stays allowed on purpose — a crawler blocked by robots.txt never
    # reads this header, and Google will index a URL it was never able to fetch.
    #
    # Server level: an `add_header` inside a location replaces the inherited set,
    # so any location added below must repeat this line.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:8081;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The site sends its own no-store headers on document responses so a
        # deploy cannot leave stale HTML pointing at chunks that no longer
        # exist. Do not add caching here that would override them.
        proxy_read_timeout 60s;
    }
}

# ── Content API ──────────────────────────────────────────────────────────────
#
# The content container publishes 127.0.0.1:8084 only, so this is the single way
# in from outside the VM. Same certificate procedure as above, its own hostname:
#
#   sudo certbot certonly --webroot -w /var/www/certbot -d staging-content-backend.ragenta.cloud
#
# The landing page keeps reading this service over the compose network as
# http://content:8084 and is not moved onto this hostname. Server-side reads
# have no reason to leave the machine, and the site's content survives nginx or
# the certificate having a bad day. This vhost exists for the browser-facing
# half: /v1/admin/* editing and /v1/docs.
#
# Two things have to line up before an admin UI in a browser works through here,
# and neither of them is nginx's doing:
#
#   - the Better Auth cookie from staging-backend.ragenta.cloud has to
#     reach this hostname, and the two are siblings under ragenta.cloud rather
#     than parent and child. AUTH_COOKIE_DOMAIN=ragenta.cloud would do it — and
#     would also hand the cookie to every production hostname, which is the same
#     registrable domain. Keep it unset and let the admin UI call this service
#     cross-origin with credentials instead (ADR-010 isolation).
#   - the UI's origin has to be listed in TRUSTED_ORIGINS. There is no wildcard
#     default any more: *.ragenta.cloud would match staging and production alike.
#
# No proxy_cache here even though the public reads send `s-maxage`: a cache zone
# has to be declared in the http block, and this file must stay a drop-in vhost.

server {
    listen 80;
    server_name staging-content-backend.ragenta.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name staging-content-backend.ragenta.cloud;

    ssl_certificate     /etc/letsencrypt/live/staging-content-backend.ragenta.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging-content-backend.ragenta.cloud/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # DOCS_ENABLED is on in staging, so /v1/docs answers with an HTML page a
    # crawler will happily index. Same reasoning as the marketing site above.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Legal documents are posted as whole markdown bodies through
    # PUT /v1/admin/legal/:slug, in two locales, and the schema puts no ceiling
    # on their length. nginx's 1m default would reject a real terms-of-service.
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8084;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # No streaming responses here, so buffering stays on. An admin request
        # can wait on a session lookup against ragenta-backend before this
        # service answers, which is why this is not the nginx 30s default.
        proxy_read_timeout 60s;
    }
}

# ── Admin console ────────────────────────────────────────────────────────────
#
# The admin container publishes 127.0.0.1:8083 only, so this is the single way
# in from outside the VM. Same certificate procedure as above, its own hostname:
#
#   sudo certbot certonly --webroot -w /var/www/certbot -d staging-admin-frontend.ragenta.cloud
#
# The console never calls a backend from the browser directly — every request
# goes to its own /api/* proxy, which forwards to ragenta-backend over the
# public hostname and to ragenta-content-backend over the compose network. So
# the cross-origin cookie problem described under the content API does not
# arise here: to the browser there is one origin, this one. It still has to
# appear in the backend's TRUSTED_ORIGINS, which is what authorises the
# forwarded sign-in.

server {
    listen 80;
    server_name staging-admin-frontend.ragenta.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name staging-admin-frontend.ragenta.cloud;

    ssl_certificate     /etc/letsencrypt/live/staging-admin-frontend.ragenta.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging-admin-frontend.ragenta.cloud/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # An internal console has nothing to gain from being indexed and something
    # to lose. Server level: an `add_header` inside a location replaces the
    # inherited set, so any location added below must repeat this line.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Legal documents are edited here as whole markdown bodies in two locales
    # and PUT through this proxy to the content API, which puts no ceiling on
    # their length. nginx's 1m default would reject a real terms-of-service.
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8083;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A page render can wait on a prefetch to ragenta-backend before this
        # app answers, which is why this is not the nginx 30s default.
        proxy_read_timeout 60s;
    }
}

# ── Customer app ─────────────────────────────────────────────────────────────
#
# The app container publishes 127.0.0.1:8082 only, so this is the single way in
# from outside the VM. Same certificate procedure as above, its own hostname:
#
#   sudo certbot certonly --webroot -w /var/www/certbot -d staging-frontend.ragenta.cloud
#
# The browser only ever talks to this origin: every backend call goes to the
# app's own /api/* proxy, which forwards to ragenta-backend over the public
# hostname carrying the caller's session cookie. That origin still has to appear
# in the backend's TRUSTED_ORIGINS, which is what authorises the forwarded
# sign-in.

server {
    listen 80;
    server_name staging-frontend.ragenta.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name staging-frontend.ragenta.cloud;

    ssl_certificate     /etc/letsencrypt/live/staging-frontend.ragenta.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging-frontend.ragenta.cloud/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # A signed-in product surface has nothing to gain from being indexed. Server
    # level: an `add_header` inside a location replaces the inherited set, so any
    # location added below must repeat this line.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Document upload. The backend caps a file at 25 MB and refuses anything
    # larger before it stores a byte; nginx's 1m default would reject almost
    # every real PDF first, with a 413 the app cannot explain.
    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:8082;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A page render can wait on a prefetch to ragenta-backend before this
        # app answers, which is why this is not the nginx 30s default.
        proxy_read_timeout 60s;
    }

    # Chat answers stream token by token over Server-Sent Events. Every default
    # here is wrong for that: nginx would buffer the whole answer and deliver it
    # in one burst at the end, and cut the connection at 60s on a long one.
    #
    # `proxy_buffering off` is the line that matters — the backend already sends
    # `X-Accel-Buffering: no`, but that header only reaches nginx through two
    # proxies, and relying on it to survive both is how a streaming endpoint
    # silently stops streaming.
    # `^~` and no trailing slash, both deliberate. A `location /api/v1/workspaces/`
    # makes nginx 301 the bare `/api/v1/workspaces` to the slashed form — and a
    # 301 on a POST is re-issued by clients as a GET, which would turn "create a
    # workspace" during onboarding into a silent no-op. `^~` also stops any regex
    # location added later from stealing these requests.
    location ^~ /api/v1/workspaces {
        proxy_pass http://127.0.0.1:8082;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header X-Robots-Tag "noindex, nofollow" always;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        # A long grounded answer on a slow provider outlasts a minute.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Uploads go through this prefix too.
        client_max_body_size 30m;
    }
}
