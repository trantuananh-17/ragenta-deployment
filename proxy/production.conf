# Reverse proxy for the production API.
#
# environments/production publishes the API on 127.0.0.1:8080 only, so this is
# the single way in from outside the VM. Install it on the production host:
#
#   sudo cp proxy/production.conf /etc/nginx/sites-available/ragenta-production
#   sudo ln -sfn /etc/nginx/sites-available/ragenta-production \
#                /etc/nginx/sites-enabled/ragenta-production
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then obtain the certificate, in *certonly* mode like staging — never
# `--nginx`, which edits the installed copy in place and makes it diverge from
# this file:
#
#   sudo mkdir -p /var/www/certbot
#   sudo certbot certonly --webroot -w /var/www/certbot -d ragenta-backend.ragenta.cloud
#
# Hostnames follow the same rule everywhere: staging is
# staging-<repository name>.ragenta.cloud, production is the same name without
# the prefix, and the marketing site in production is the apex, ragenta.cloud.
# So this file's siblings are ragenta-backend, ragenta-content-backend,
# ragenta-frontend and ragenta-admin-frontend, all under .ragenta.cloud.
#
# Production answers for its own names only, so a request naming some other host
# never reaches it — proxy/default-deny.conf takes those. Production and staging
# must not share a machine: their hostnames are siblings under one registrable
# domain, and the same API_PORT would collide.
server {
    listen 80;
    listen [::]:80;
    server_name ragenta-backend.ragenta.cloud;

    # Renewal re-runs the HTTP-01 challenge, so this must stay reachable over
    # plain HTTP forever. It is matched before the redirect below.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ragenta-backend.ragenta.cloud;

    ssl_certificate     /etc/letsencrypt/live/ragenta-backend.ragenta.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ragenta-backend.ragenta.cloud/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Document ingestion posts files through here.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Chat responses stream token by token; nginx buffering would hold the
        # whole answer until the request finished.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}

# ── Marketing site ───────────────────────────────────────────────────────────
#
# The landing container publishes 127.0.0.1:8081 only, so this is the single way
# in from outside the VM. In production the marketing site is the apex itself,
# not ragenta-landing-page.ragenta.cloud — the repository-named hostname is a
# staging convention, and nobody types a repository name to reach a home page.
#
# One certificate covers both names, so www can redirect over HTTPS rather than
# dying on a name the certificate does not carry:
#
#   sudo certbot certonly --webroot -w /var/www/certbot #        -d ragenta.cloud -d www.ragenta.cloud
#
# Nothing runs this file yet: production has no VM, no GitHub Environment and no
# .env. Staging is still the only live environment.

server {
    listen 80;
    listen [::]:80;
    server_name ragenta.cloud www.ragenta.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# www exists because the registrar's default zone ships a www CNAME. It is a
# redirect, not a second copy of the site: two hostnames serving the same pages
# split the canonical URL and every link to it.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.ragenta.cloud;

    ssl_certificate     /etc/letsencrypt/live/ragenta.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ragenta.cloud/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    return 301 https://ragenta.cloud$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ragenta.cloud;

    ssl_certificate     /etc/letsencrypt/live/ragenta.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ragenta.cloud/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    location / {
        proxy_pass http://127.0.0.1:8081;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The site sends its own no-store headers on document responses so a
        # deploy cannot leave stale HTML pointing at chunks that no longer
        # exist. Do not add caching here that would override them.
        proxy_read_timeout 60s;
    }
}

# ── Content API ──────────────────────────────────────────────────────────────
#
# The content container publishes 127.0.0.1:8084 only, so this is the single way
# in from outside the VM. Same certificate procedure as above, its own hostname.
#
#   sudo certbot certonly --webroot -w /var/www/certbot -d ragenta-content-backend.ragenta.cloud
#
# The landing page keeps reading this service over the compose network as
# http://content:8084 and is not moved onto this hostname. Server-side reads
# have no reason to leave the machine, and the site's content survives nginx or
# the certificate having a bad day. This vhost exists for the browser-facing
# half: /v1/admin/* editing, and /v1/docs where DOCS_ENABLED allows it — which
# in production it does not.
#
# Two things have to line up before an admin UI in a browser works through here,
# and neither of them is nginx's doing:
#
#   - the Better Auth cookie from ragenta-backend.ragenta.cloud has to reach this
#     hostname, and the two are siblings rather than parent and child.
#     AUTH_COOKIE_DOMAIN=ragenta.cloud would do it — and would also hand the
#     cookie to every staging hostname, which is the same registrable domain.
#     Keep it unset and let the admin UI call this service cross-origin with
#     credentials instead (ADR-010 isolation).
#   - the UI's origin has to be listed in TRUSTED_ORIGINS. There is no wildcard
#     default any more: *.ragenta.cloud would match staging's hostnames too.

server {
    listen 80;
    listen [::]:80;
    server_name ragenta-content-backend.ragenta.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ragenta-content-backend.ragenta.cloud;

    ssl_certificate     /etc/letsencrypt/live/ragenta-content-backend.ragenta.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ragenta-content-backend.ragenta.cloud/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Legal documents are posted as whole markdown bodies through
    # PUT /v1/admin/legal/:slug, in two locales, and the schema puts no ceiling
    # on their length. nginx's 1m default would reject a real terms-of-service.
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8084;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # No streaming responses here, so buffering stays on. An admin request
        # can wait on a session lookup against ragenta-backend before this
        # service answers, which is why this is not the nginx 30s default.
        proxy_read_timeout 60s;
    }
}
