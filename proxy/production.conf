# Reverse proxy for the production API.
#
# environments/production publishes the API on 127.0.0.1:8080 only, so this is
# the single way in from outside the VM. Install it on the production host:
#
#   sudo cp proxy/production.conf /etc/nginx/sites-available/ragenta-production
#   sudo ln -sfn /etc/nginx/sites-available/ragenta-production \
#                /etc/nginx/sites-enabled/ragenta-production
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then obtain the certificate, which rewrites this file's listen directives:
#
#   sudo certbot --nginx -d api.ragenta.com
#
# Unlike proxy/staging.conf this is not a default_server: production answers for
# its own name only, so a request for some other host never reaches it. If the
# two ever share a machine, staging must lose default_server too and both get a
# real server_name — and each environment needs its own API_PORT.
server {
    listen 80;
    listen [::]:80;
    server_name api.ragenta.com;

    # Document ingestion posts files through here.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Chat responses stream token by token; nginx buffering would hold the
        # whole answer until the request finished.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}

# ── Marketing site ───────────────────────────────────────────────────────────
#
# The landing container publishes 127.0.0.1:8081 only, so this is the single way
# in from outside the VM. Same certificate procedure as above, its own hostname:
#
#   sudo certbot certonly --webroot -w /var/www/certbot -d ragenta.com

server {
    listen 80;
    listen [::]:80;
    server_name ragenta.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ragenta.com;

    ssl_certificate     /etc/letsencrypt/live/ragenta.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ragenta.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    location / {
        proxy_pass http://127.0.0.1:8081;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The site sends its own no-store headers on document responses so a
        # deploy cannot leave stale HTML pointing at chunks that no longer
        # exist. Do not add caching here that would override them.
        proxy_read_timeout 60s;
    }
}
