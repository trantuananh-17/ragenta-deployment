# Reverse proxy for the production API.
#
# environments/production publishes the API on 127.0.0.1:8080 only, so this is
# the single way in from outside the VM. Install it on the production host:
#
#   sudo cp proxy/production.conf /etc/nginx/sites-available/ragenta-production
#   sudo ln -sfn /etc/nginx/sites-available/ragenta-production \
#                /etc/nginx/sites-enabled/ragenta-production
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then obtain the certificate, in *certonly* mode like staging — never
# `--nginx`, which edits the installed copy in place and makes it diverge from
# this file:
#
#   sudo mkdir -p /var/www/certbot
#   sudo certbot certonly --webroot -w /var/www/certbot -d backend.ragenta.cloud
#
# Hostnames follow the same rule everywhere: the repository name with the
# ragenta- prefix dropped, under staging- on staging and bare in production, and
# the marketing site is the root of its environment — staging.ragenta.cloud
# there, the apex here. So this file serves backend, content-backend, frontend
# and admin-frontend, all under .ragenta.cloud.
#
# Production answers for its own names only, so a request naming some other host
# never reaches it — proxy/default-deny.conf takes those. Production and staging
# must not share a machine: their hostnames are siblings under one registrable
# domain, and the same API_PORT would collide.
server {
    listen 80;
    listen [::]:80;
    server_name backend.ragenta.cloud;

    # Renewal re-runs the HTTP-01 challenge, so this must stay reachable over
    # plain HTTP forever. It is matched before the redirect below.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name backend.ragenta.cloud;

    ssl_certificate     /etc/letsencrypt/live/backend.ragenta.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backend.ragenta.cloud/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Document ingestion posts files through here.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Chat responses stream token by token; nginx buffering would hold the
        # whole answer until the request finished.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}

# ── Marketing site ───────────────────────────────────────────────────────────
#
# The landing container publishes 127.0.0.1:8081 only, so this is the single way
# in from outside the VM. The marketing site is the root of its environment, not
# a named host: the apex here, staging.ragenta.cloud on staging. Nobody types a
# service name to reach a home page.
#
# One certificate covers both names, so www can redirect over HTTPS rather than
# dying on a name the certificate does not carry:
#
#   sudo certbot certonly --webroot -w /var/www/certbot -d ragenta.cloud -d www.ragenta.cloud
#
# Nothing runs this file yet: production has no VM, no GitHub Environment and no
# .env. Staging is still the only live environment.

server {
    listen 80;
    listen [::]:80;
    server_name ragenta.cloud www.ragenta.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# www exists because the registrar's default zone ships a www CNAME. It is a
# redirect, not a second copy of the site: two hostnames serving the same pages
# split the canonical URL and every link to it.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.ragenta.cloud;

    ssl_certificate     /etc/letsencrypt/live/ragenta.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ragenta.cloud/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    return 301 https://ragenta.cloud$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ragenta.cloud;

    ssl_certificate     /etc/letsencrypt/live/ragenta.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ragenta.cloud/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    location / {
        proxy_pass http://127.0.0.1:8081;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The site sends its own no-store headers on document responses so a
        # deploy cannot leave stale HTML pointing at chunks that no longer
        # exist. Do not add caching here that would override them.
        proxy_read_timeout 60s;
    }
}

# ── Content API ──────────────────────────────────────────────────────────────
#
# The content container publishes 127.0.0.1:8084 only, so this is the single way
# in from outside the VM. Same certificate procedure as above, its own hostname.
#
#   sudo certbot certonly --webroot -w /var/www/certbot -d content-backend.ragenta.cloud
#
# The landing page keeps reading this service over the compose network as
# http://content:8084 and is not moved onto this hostname. Server-side reads
# have no reason to leave the machine, and the site's content survives nginx or
# the certificate having a bad day. This vhost exists for the browser-facing
# half: /v1/admin/* editing, and /v1/docs where DOCS_ENABLED allows it — which
# in production it does not.
#
# Two things have to line up before an admin UI in a browser works through here,
# and neither of them is nginx's doing:
#
#   - the Better Auth cookie from backend.ragenta.cloud has to reach this
#     hostname, and the two are siblings rather than parent and child.
#     AUTH_COOKIE_DOMAIN=ragenta.cloud would do it — and would also hand the
#     cookie to every staging hostname, which is the same registrable domain.
#     Keep it unset and let the admin UI call this service cross-origin with
#     credentials instead (ADR-010 isolation).
#   - the UI's origin has to be listed in TRUSTED_ORIGINS. There is no wildcard
#     default any more: *.ragenta.cloud would match staging's hostnames too.

server {
    listen 80;
    listen [::]:80;
    server_name content-backend.ragenta.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name content-backend.ragenta.cloud;

    ssl_certificate     /etc/letsencrypt/live/content-backend.ragenta.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/content-backend.ragenta.cloud/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Legal documents are posted as whole markdown bodies through
    # PUT /v1/admin/legal/:slug, in two locales, and the schema puts no ceiling
    # on their length. nginx's 1m default would reject a real terms-of-service.
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8084;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # No streaming responses here, so buffering stays on. An admin request
        # can wait on a session lookup against ragenta-backend before this
        # service answers, which is why this is not the nginx 30s default.
        proxy_read_timeout 60s;
    }
}

# ── Admin console ────────────────────────────────────────────────────────────
#
# The admin container publishes 127.0.0.1:8083 only, so this is the single way
# in from outside the VM. Same certificate procedure as above, its own hostname:
#
#   sudo certbot certonly --webroot -w /var/www/certbot -d admin-frontend.ragenta.cloud
#
# The console never calls a backend from the browser directly — every request
# goes to its own /api/* proxy, which forwards to ragenta-backend over the
# public hostname and to ragenta-content-backend over the compose network. So
# the cross-origin cookie problem described under the content API does not
# arise here: to the browser there is one origin, this one. It still has to
# appear in the backend's TRUSTED_ORIGINS, which is what authorises the
# forwarded sign-in.

server {
    listen 80;
    server_name admin-frontend.ragenta.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name admin-frontend.ragenta.cloud;

    ssl_certificate     /etc/letsencrypt/live/admin-frontend.ragenta.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin-frontend.ragenta.cloud/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # An internal console has nothing to gain from being indexed and something
    # to lose. Server level: an `add_header` inside a location replaces the
    # inherited set, so any location added below must repeat this line.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Legal documents are edited here as whole markdown bodies in two locales
    # and PUT through this proxy to the content API, which puts no ceiling on
    # their length. nginx's 1m default would reject a real terms-of-service.
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8083;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A page render can wait on a prefetch to ragenta-backend before this
        # app answers, which is why this is not the nginx 30s default.
        proxy_read_timeout 60s;
    }
}

# ── Customer app ─────────────────────────────────────────────────────────────
#
# The app container publishes 127.0.0.1:8082 only, so this is the single way in
# from outside the VM. Same certificate procedure as above, its own hostname:
#
#   sudo certbot certonly --webroot -w /var/www/certbot -d frontend.ragenta.cloud
#
# The browser only ever talks to this origin: every backend call goes to the
# app's own /api/* proxy, which forwards to ragenta-backend over the public
# hostname carrying the caller's session cookie. That origin still has to appear
# in the backend's TRUSTED_ORIGINS, which is what authorises the forwarded
# sign-in.

server {
    listen 80;
    server_name frontend.ragenta.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name frontend.ragenta.cloud;

    ssl_certificate     /etc/letsencrypt/live/frontend.ragenta.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/frontend.ragenta.cloud/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # A signed-in product surface has nothing to gain from being indexed. Server
    # level: an `add_header` inside a location replaces the inherited set, so any
    # location added below must repeat this line.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Document upload. The backend caps a file at 25 MB and refuses anything
    # larger before it stores a byte; nginx's 1m default would reject almost
    # every real PDF first, with a 413 the app cannot explain.
    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:8082;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A page render can wait on a prefetch to ragenta-backend before this
        # app answers, which is why this is not the nginx 30s default.
        proxy_read_timeout 60s;
    }

    # Chat answers stream token by token over Server-Sent Events. Every default
    # here is wrong for that: nginx would buffer the whole answer and deliver it
    # in one burst at the end, and cut the connection at 60s on a long one.
    #
    # `proxy_buffering off` is the line that matters — the backend already sends
    # `X-Accel-Buffering: no`, but that header only reaches nginx through two
    # proxies, and relying on it to survive both is how a streaming endpoint
    # silently stops streaming.
    # `^~` and no trailing slash, both deliberate. A `location /api/v1/workspaces/`
    # makes nginx 301 the bare `/api/v1/workspaces` to the slashed form — and a
    # 301 on a POST is re-issued by clients as a GET, which would turn "create a
    # workspace" during onboarding into a silent no-op. `^~` also stops any regex
    # location added later from stealing these requests.
    location ^~ /api/v1/workspaces {
        proxy_pass http://127.0.0.1:8082;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header X-Robots-Tag "noindex, nofollow" always;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        # A long grounded answer on a slow provider outlasts a minute.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Uploads go through this prefix too.
        client_max_body_size 30m;
    }
}
