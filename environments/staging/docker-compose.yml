# Staging: the released backend image plus its own datastores.
#
# API and worker are the same image with different commands. The datastores
# publish no host ports at all — they are reachable only on this project's
# network, which is what keeps staging isolated from every other stack on the
# machine (ADR-010).
#
# Migrations are an explicit step run before this file starts the new
# containers, never a container entrypoint (ADR-003):
#
#   docker compose run --rm api node dist/db/migrate.js
name: ragenta-staging

services:
  api:
    image: ghcr.io/trantuananh-17/ragenta-backend:${IMAGE_TAG}
    restart: unless-stopped
    # Optional so the file still renders for validation on a machine that holds
    # no secrets. A deploy refuses outright when .env is missing, so a staging
    # container can never start with an empty configuration.
    env_file:
      - path: .env
        required: false
    environment:
      # Built here rather than written by hand in .env: the hostnames are this
      # project's service names, and an operator editing a connection string is
      # how a staging stack ends up pointed at another environment's database.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    ports:
      - "${API_BIND}:${API_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # node's global fetch — the runtime image has no curl or wget.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    image: ghcr.io/trantuananh-17/ragenta-backend:${IMAGE_TAG}
    restart: unless-stopped
    command: ["node", "dist/main.worker.js"]
    # Optional so the file still renders for validation on a machine that holds
    # no secrets. A deploy refuses outright when .env is missing, so a staging
    # container can never start with an empty configuration.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  postgres-data:
  redis-data:
  minio-data:
  qdrant-data:
