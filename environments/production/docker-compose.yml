# Production: the released backend image plus its own datastores.
#
# Identical in shape to environments/staging — same services, same health
# checks, same isolation — because a difference between the two is a difference
# that will only be discovered in production. What separates them is .env:
# image tag, URLs, secrets, and DOCS_ENABLED.
#
# API and worker are the same image with different commands. The datastores
# publish no host ports; they are reachable only on this project's network
# (ADR-010).
#
# Migrations are an explicit step run before this file starts the new
# containers, never a container entrypoint (ADR-003):
#
#   docker compose run --rm api node dist/db/migrate.js
name: ragenta-production

services:
  api:
    image: ghcr.io/trantuananh-17/ragenta-backend:${IMAGE_TAG_BACKEND}
    restart: unless-stopped
    # Optional so the file still renders for validation on a machine that holds
    # no secrets. A deploy refuses outright when .env is missing, so a
    # production container can never start with an empty configuration.
    env_file:
      - path: .env
        required: false
    environment:
      # Built here rather than written by hand in .env: the hostnames are this
      # project's service names, and an operator editing a connection string is
      # how production ends up pointed at another environment's database.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    ports:
      - "${API_BIND}:${API_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # node's global fetch — the runtime image has no curl or wget.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    image: ghcr.io/trantuananh-17/ragenta-backend:${IMAGE_TAG_BACKEND}
    restart: unless-stopped
    command: ["node", "dist/main.worker.js"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # The marketing site. It talks to nothing in this stack — no database, no
  # Redis, no queue — so it has no depends_on and starts even when the rest of
  # the environment is down.
  landing:
    image: ghcr.io/trantuananh-17/ragenta-landing-page:${IMAGE_TAG_LANDING_PAGE}
    restart: unless-stopped
    # Deliberately no env_file. api and worker read the whole .env because they
    # need most of it; a public marketing site needs four values and no secret.
    # Handing it the shared file would put the database password, the Stripe
    # key and every provider credential inside the most exposed container here.
    environment:
      NODE_ENV: production
      # The image already defaults to 8020, but .env sets PORT=8080 for the API
      # and Compose would pass that through if this were ever given an env_file.
      # Stating it here keeps the published port below and the port the server
      # binds from drifting apart.
      PORT: 8020
      HOSTNAME: 0.0.0.0
      # Canonical, hreflang and OG URLs are built from this, so a wrong value
      # is not a broken page — it is a page that indexes under the wrong host.
      SITE_URL: ${SITE_URL}
      # Where the signup CTAs go. Reuses the backend's variable rather than
      # adding a second name for the same thing, which is how the two end up
      # disagreeing about where the app lives.
      APP_URL: ${APP_BASE_URL}
      # Unset means /api/contact answers 503 and the form shows an error.
      CONTACT_WEBHOOK_URL: ${CONTACT_WEBHOOK_URL}
      # Unset means PostHog is not loaded at all.
      POSTHOG_KEY: ${POSTHOG_KEY}
      POSTHOG_HOST: ${POSTHOG_HOST}
      # Unset means the site serves its bundled content fixtures.
      RAGENTA_CONTENT_API_URL: ${RAGENTA_CONTENT_API_URL}
    ports:
      - "${LANDING_BIND}:${LANDING_PORT}:8020"
    healthcheck:
      # node's global fetch — the runtime image has no curl or wget. /api/health
      # rather than /health: the site's locale middleware redirects a bare
      # /health into the [lang] router, which 404s.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8020/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data

  qdrant:
    image: qdrant/qdrant:v1.19.0
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  postgres-data:
  redis-data:
  minio-data:
  qdrant-data:
